name: Daily K-FGI Update

on:
  schedule:
    - cron: "5 8 * * 1-5"       # 17:05 KST - 장마감 후 공식 확정치
    - cron: "0,30 0-6 * * 1-5"  # 09:00~15:30 KST 30분마다 - 장중 근사치
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pykrx==1.2.8 yfinance==1.6.0 numpy pandas==2.2.2

      
      - name: 지수 계산
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/collect_static.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "kfg-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/history.json
          git diff --cached --quiet || git commit -m "chore: update index $(date -u +%Y-%m-%d)"
          git push
