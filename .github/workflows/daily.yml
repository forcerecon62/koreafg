name: Daily K-FGI Update

on:
  schedule:
    # 08:05 UTC = 17:05 KST, 평일만 (KRX 개장일 근사치. 공휴일엔 일부 지표가 비어도
    # collect_static.py가 자동으로 건너뛰고 나머지 지표로 계산한다)
    - cron: "5 8 * * 1-5"
  workflow_dispatch: {}  # Actions 탭에서 수동으로 즉시 실행 가능 (휴대폰에서도 가능)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pykrx==1.2.8 yfinance==0.2.44 numpy pandas==2.2.2
      - name: 지수 계산
        run: python scripts/collect_static.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "kfg-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/history.json
          git diff --cached --quiet || git commit -m "chore: update index $(date -u +%Y-%m-%d)"
          git push
